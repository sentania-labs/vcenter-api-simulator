# 106 ESA clusters of eight hosts, all the same size: 848 hosts and 3,392 VMs
# in one simulated vCenter. See docs/sizing.md for what that needs.
seed: scale-100
datacenters:
  - name: dc-01
    clusters: 106
defaults:
  hosts: 8
  dedup: true
  compression: true
  host:
    threads: 32
    domWorlds: 66
    vsanPnics: 2
    claimedDevices: 1
    localDevices: 1
  vms:
    perHost: 4
    disksPerVM: 1
auth:
  users:
    - name: administrator@vsphere.local
      password: VMware1!
