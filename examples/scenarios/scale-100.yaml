# Scale profile "stress" (docs/TESTING.md scale matrix), named scale-100 for
# the roadmap's 100+ cluster tier: 106 ESA clusters of eight hosts (uniform,
# where the matrix allows 8-16), 848 hosts in one simulated vCenter.
seed: scale-100
datacenters:
  - name: dc-01
    clusters: 106
defaults:
  hosts: 8
  dedup: true
  compression: true
  host:
    threads: 32
    domWorlds: 66
    vsanPnics: 2
    claimedDevices: 1
    localDevices: 1
  vms:
    perHost: 4
    disksPerVM: 1
auth:
  users:
    - name: administrator@vsphere.local
      password: VMware1!
