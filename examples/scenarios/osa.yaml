# Three-host OSA cluster with a working vSAN performance primary.
# Set statsPrimary to false to reproduce the missing-primary state.
seed: osa
datacenters:
  - name: dc-01
    clusters: 1
    nfs:
      - name: shared-nfs
        remoteHost: nfs.sim.invalid
        remotePath: /exports/sim
        capacity: 1000000000000
        freeSpace: 800000000000
defaults:
  architecture: osa
  statsPrimary: true
  hosts: 3
  host:
    threads: 5
    domWorlds: 14
    vsanPnics: 1
    claimedDevices: 1
    localDevices: 1
  vms:
    perHost: 1
    disksPerVM: 1
