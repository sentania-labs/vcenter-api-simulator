# Fifty ESA clusters of eight hosts: 400 hosts and 1,600 VMs. Every cluster is
# the same size, so a load test's numbers come from volume rather than from
# varied shapes.
seed: scale-50
datacenters:
  - name: dc-01
    clusters: 50
defaults:
  hosts: 8
  dedup: true
  compression: true
  host:
    threads: 32
    domWorlds: 66
    vsanPnics: 2
    claimedDevices: 1
    localDevices: 1
  vms:
    perHost: 4
    disksPerVM: 1
auth:
  users:
    - name: administrator@vsphere.local
      password: VMware1!
