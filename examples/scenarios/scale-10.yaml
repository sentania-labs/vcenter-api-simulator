# Ten clusters with varied host and VM cardinality.
seed: scale-10
datacenters:
  - name: dc-01
    clusters: 10
defaults:
  hosts: 8
  dedup: true
  compression: true
  host:
    threads: 32
    domWorlds: 66
    vsanPnics: 2
    claimedDevices: 1
    localDevices: 1
  vms:
    perHost: 4
    disksPerVM: 1
vary:
  hosts: [8, 8, 12]
  vmsPerHost: {min: 2, max: 8}
  claimedDevices: [1, 1, 2]
  domWorlds: {min: 40, max: 90}
auth:
  users:
    - name: administrator@vsphere.local
      password: VMware1!
