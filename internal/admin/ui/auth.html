<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · vCenter API Simulator</title><link rel="stylesheet" href="/lattice/tokens.css"><link rel="stylesheet" href="/lattice/lattice.css"><link rel="stylesheet" href="/auth.css"><script type="module" src="/auth.js"></script></head>
<body><main class="auth-shell"><section class="lat-card auth-card"><p class="eyebrow">vCenter API Simulator</p><h1 id="title">Sign in</h1><p id="intro">Enter this console’s password.</p><form id="form"><label class="lat-label" for="password">Console password</label><input class="lat-input" id="password" name="password" type="password" autocomplete="current-password" required autofocus><div id="confirm-row" hidden><label class="lat-label" for="confirm">Confirm password</label><input class="lat-input" id="confirm" type="password" autocomplete="new-password"></div><p id="error" role="alert" hidden></p><button class="lat-btn lat-btn--primary" id="submit" type="submit">Sign in</button></form></section></main></body></html>
