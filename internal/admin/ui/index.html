<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vCenter Simulator</title>
<script>
  // theme before first paint: ?theme=dark|light, else the saved choice, else the system's
  (function () {
    var q = /[?&]theme=(dark|light)/.exec(location.search), t = q ? q[1] : null;
    try { if (!t) t = localStorage.getItem('vcs-theme'); } catch (e) {}
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="lattice/tokens.css">
<link rel="stylesheet" href="lattice/lattice.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"><div class="m-loading" role="status">Loading…</div></div>
<div id="overlay" hidden></div>
<noscript>The console needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
