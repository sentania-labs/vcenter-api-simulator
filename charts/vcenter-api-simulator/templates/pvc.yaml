{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (not (include "vcsim.tlsSecretName" .)) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vcsim.fullname" . }}
  labels:
    {{- include "vcsim.labels" . | nindent 4 }}
  annotations:
    # Keep the certificate (the identity a management pack pinned) when the
    # release is uninstalled, pruned, or its Argo CD Application is deleted;
    # delete the claim deliberately to rotate it.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ if eq "-" .Values.persistence.storageClass }}""{{ else }}{{ .Values.persistence.storageClass }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
