{{- if and .Values.credentials.enabled (not .Values.credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vcsim.credentialsSecretName" . }}
  labels:
    {{- include "vcsim.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "credentials.username is required when credentials.enabled" .Values.credentials.username | quote }}
  password: {{ required "credentials.password is required when credentials.enabled" .Values.credentials.password | quote }}
{{- end }}
