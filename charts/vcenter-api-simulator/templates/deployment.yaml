apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vcsim.fullname" . }}
  labels:
    {{- include "vcsim.labels" . | nindent 4 }}
spec:
  # One release is one vCenter with one identity and one certificate volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vcsim.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vcsim.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if and .Values.credentials.enabled (not .Values.credentials.existingSecret) }}
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vcsim.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vcsimulator
          image: {{ include "vcsim.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - -listen=0.0.0.0:{{ .Values.simulator.port }}
            - -tls-dir=/data/tls
            - -seed={{ .Values.simulator.seed }}
            - -tls-names={{ include "vcsim.tlsNames" . }}
            {{- range .Values.simulator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: TMPDIR
              value: /tmp
            {{- if .Values.credentials.enabled }}
            - name: VCSIM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vcsim.credentialsSecretName" . }}
                  key: username
            - name: VCSIM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vcsim.credentialsSecretName" . }}
                  key: password
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.simulator.port }}
              protocol: TCP
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: https
              scheme: HTTPS
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: https
              scheme: HTTPS
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: https
              scheme: HTTPS
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /data/tls
              {{- if include "vcsim.tlsSecretName" . }}
              readOnly: true
              {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          {{- if include "vcsim.tlsSecretName" . }}
          secret:
            secretName: {{ include "vcsim.tlsSecretName" . }}
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: key.pem
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "vcsim.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
