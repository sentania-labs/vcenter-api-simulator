hostname: vcsim-01.example.test
simulator:
  # the Ingress ends TLS, so tools are told to trust its certificate
  lookupTrustSecret: vcsim-01-ingress-tls
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  tls:
    enabled: true
    secretName: vcsim-01-ingress-tls
