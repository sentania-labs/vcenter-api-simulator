# Local developer workflow: one simulated vCenter on https://localhost:8443.
#
#   docker compose up -d            # pulls ghcr.io/sentania-labs/vcenter-api-simulator:main
#   docker compose up -d --build    # builds the image from this checkout instead
#   docker compose logs -f
#
# The control console is on http://localhost:9090/ (loopback only).
#
# The identity registry, the certificate and the console's applied scenario
# are created on first start and kept in the `data` volume, so the identities
# and the fingerprint a management pack pinned survive `docker compose restart`.
# Remove the volume (`docker compose down -v`) to issue new ones.
services:
  vcsim:
    image: ghcr.io/sentania-labs/vcenter-api-simulator:${VCSIM_TAG:-main}
    build:
      context: .
      args:
        VERSION: ${VCSIM_TAG:-dev}
    command:
      - -listen=0.0.0.0:8443
      - -data=/data
      - -seed=${VCSIM_SEED:-phase1}
      # Extra subject alternative names for the certificate created on first
      # start, for example the hostname collectors use to reach this machine.
      - -tls-names=${VCSIM_TLS_NAMES:-}
    environment:
      # Leave both unset to use the published administrator default.
      # Set both to restrict login to one pair; placeholders only, never real
      # vCenter credentials.
      VCSIM_USERNAME: ${VCSIM_USERNAME:-}
      VCSIM_PASSWORD: ${VCSIM_PASSWORD:-}
      # administrator (default) or read-only, for that user.
      VCSIM_ROLE: ${VCSIM_ROLE:-}
    ports:
      - "${VCSIM_PORT:-8443}:8443"
      # The password-protected control console is published on loopback only.
      # Open http://localhost:9090/ . Use TLS before publishing it elsewhere.
      - "127.0.0.1:${VCSIM_ADMIN_PORT:-9090}:9090"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No container healthcheck: the runtime image has no shell or curl. Probe
    # from outside with https://localhost:8443/sdk/vimServiceVersions.xml.
    restart: unless-stopped

volumes:
  data:
