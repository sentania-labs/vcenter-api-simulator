name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The reference management pack, pinned: sentania-labs/vsanhostmetrics
  # branch tuneup/upstream-2026-10 (tag v2.0.0-rc.2).
  MP_REPO: https://github.com/sentania-labs/vsanhostmetrics
  MP_COMMIT: af976fb9fe97bbac2fd94b666a3f79aa12656f2a
  PYVMOMI: pyvmomi==8.0.3.0.1

jobs:
  go:
    name: go build and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      # catalog_test regenerates catalog.json from the fixtures and fails if
      # the embedded copy is stale; it also scans the fixtures for lab and
      # hardware identity.
      - run: go test ./... -count=1

  mp-collector:
    name: management pack collector harness (pyVmomi 8.0.3, pack @ pinned commit)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check out the reference management pack at the pinned commit
        run: |
          git clone --quiet "$MP_REPO" "$RUNNER_TEMP/mp"
          git -C "$RUNNER_TEMP/mp" checkout --quiet "$MP_COMMIT"
      - run: pip install "$PYVMOMI"
      - name: build and start the simulator
        run: |
          go build -o "$RUNNER_TEMP/vcsimulator" ./cmd/vcsimulator
          "$RUNNER_TEMP/vcsimulator" -listen 127.0.0.1:8443 -tls-dir "$RUNNER_TEMP/tls" -seed ci > "$RUNNER_TEMP/sim.log" 2>&1 &
          for i in $(seq 1 30); do curl -sk https://127.0.0.1:8443/sdk/vimServiceVersions.xml >/dev/null && break; sleep 1; done
          cat "$RUNNER_TEMP/sim.log"
          curl -sk https://127.0.0.1:8443/sdk/vimServiceVersions.xml | grep -q '<version>9.1.1.0</version>' || { echo "simulator did not start"; exit 1; }
      - name: run the pack's perfsvc functions against the simulator
        run: |
          python3 tools/mp-harness/harness.py --sim 127.0.0.1:8443 --mp "$RUNNER_TEMP/mp" \
            --fixtures fixtures/live/9.1.1 --ca "$RUNNER_TEMP/tls/cert.pem" --report "$RUNNER_TEMP/harness.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mp-collector-harness
          path: ${{ runner.temp }}/harness.json

  mp-test:
    name: mp-test connect and collect x2 (Operations SDK 1.3.1, Docker)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check out the reference management pack at the pinned commit
        run: |
          git clone --quiet "$MP_REPO" "$RUNNER_TEMP/mp"
          git -C "$RUNNER_TEMP/mp" checkout --quiet "$MP_COMMIT"
      - run: pip install "vmware-aria-operations-integration-sdk==1.3.1"
      - name: build and start the simulator (reachable from the adapter container)
        run: |
          go build -o "$RUNNER_TEMP/vcsimulator" ./cmd/vcsimulator
          "$RUNNER_TEMP/vcsimulator" -listen 0.0.0.0:8443 -tls-dir "$RUNNER_TEMP/tls" -seed ci > "$RUNNER_TEMP/sim.log" 2>&1 &
          for i in $(seq 1 30); do curl -sk https://127.0.0.1:8443/sdk/vimServiceVersions.xml >/dev/null && break; sleep 1; done
          cat "$RUNNER_TEMP/sim.log"
          curl -sk https://127.0.0.1:8443/sdk/vimServiceVersions.xml | grep -q '<version>9.1.1.0</version>' || { echo "simulator did not start"; exit 1; }
      - name: mp-test connect, then collect twice, and compare
        run: |
          python3 tools/mp-harness/mp_test_run.py --mp "$RUNNER_TEMP/mp" --sim-port 8443 \
            --scope dashboard --attach false --report "$RUNNER_TEMP/mp-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mp-test
          path: |
            ${{ runner.temp }}/mp-test.json
            ${{ runner.temp }}/mp/logs/
