name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The reference management pack's own collector is not run here: that is the
# optional, manually dispatched mp-acceptance workflow. The container image
# and Helm chart gates, including the vSphere client smoke test, are in
# package.yml.
jobs:
  go:
    name: go build and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      # catalog_test regenerates catalog.json from the fixtures and fails if
      # the embedded copy is stale; it also scans the fixtures for lab and
      # hardware identity.
      - run: go test ./... -count=1
