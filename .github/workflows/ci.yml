name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The reference management pack's own collector is not run here: that is the
# optional, manually dispatched mp-acceptance workflow. The container image
# and Helm chart gates, including the PowerCLI container smoke, are in
# package.yml. The ten-cluster govc smoke, with the restart-identity check,
# runs here.

jobs:
  go:
    name: go build and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      # catalog_test regenerates catalog.json from the fixtures and fails if
      # the embedded copy is stale; it also scans the fixtures for lab and
      # hardware identity. The sim tests cover the Phase 1 contract replay,
      # the ten-cluster scenario, restart identity, auth, faults and latency.
      - run: go test ./... -count=1

  smoke:
    name: vSphere client smoke (govc, ten clusters, restart)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # govc is its own module with no release tags, so install the release
      # binary of the govmomi version the simulator builds on, by checksum.
      - name: install govc v0.56.2
        env:
          GOVC_SHA256: 12889f30e42e868487041f6628e9789606c80e13a194fb37c099abffc92d5a59
        run: |
          curl -fsSL -o "$RUNNER_TEMP/govc.tar.gz" \
            https://github.com/vmware/govmomi/releases/download/v0.56.2/govc_Linux_x86_64.tar.gz
          echo "$GOVC_SHA256  $RUNNER_TEMP/govc.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/govc-bin"
          tar -xzf "$RUNNER_TEMP/govc.tar.gz" -C "$RUNNER_TEMP/govc-bin" govc
          echo "$RUNNER_TEMP/govc-bin" >> "$GITHUB_PATH"
      # Connect, list hosts and VMs, compare the counts with the scenario,
      # dump every identity, restart on the same data directory, dump again
      # and diff: tools/smoke/smoke.sh.
      - run: tools/smoke/smoke.sh --scenario examples/scenarios/ten-clusters.yaml --port 18443
      - run: tools/smoke/smoke.sh --scenario examples/scenarios/phase1.yaml --port 18444
      - run: tools/smoke/smoke.sh --scenario examples/scenarios/storage.yaml --port 18445 --storage
